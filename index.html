<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Music</title>
<link rel="preload" href="fonts/ChakraPetch-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ChakraPetch-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="receiver.css">
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
<video class="castMediaElement" playsinline></video>

<main id="splash" class="screen">
  <img class="splash-logo" src="core-music-logo.png" alt="Core Music">
  <div class="splash-name">Core Music</div>
</main>

<main id="player" class="screen hidden">
  <section class="top">
    <div class="cover" id="cover"><img id="coverImg" alt=""></div>
    <div class="brand-name">Core Music</div>
    <img class="brand-logo" src="core-music-logo.png" alt="Core Music">
  </section>
  <section class="text">
    <div class="title" id="title"></div>
    <div class="artist" id="artist"></div>
    <div class="album" id="album"></div>
  </section>
  <footer class="bottom">
    <canvas class="wave hidden" id="wave"></canvas>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <div class="times"><span id="cur">0:00</span><span id="state"></span><span id="dur">0:00</span></div>
  </footer>
</main>

<script src="receiver.js"></script>
</body>
</html>
